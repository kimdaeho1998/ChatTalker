[package]
name = "chatalker"
version = "0.1.0"
description = "Chatalker desktop foundation"
authors = ["SunBI Messenger"]
edition = "2021"

[lib]
name = "chatalker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
keyring = { version = "3", features = ["windows-native"] }
